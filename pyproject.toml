[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "osf-mcp-server"
version = "0.1.0"
description = "MCP server for Open Science Framework (OSF) - search projects, registrations, preprints, and manage files"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Researcher Team" }
]
dependencies = [
    "httpx>=0.24.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.8.0",
    "mcp>=1.2.0",
    "pymupdf4llm>=0.0.17",
    "aiohttp>=3.9.1",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.1.0",
    "aiofiles>=23.2.1",
    "anyio>=4.2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.10.0",
    "aioresponses>=0.7.6"
]
dev = [
    "black>=23.3.0",
    "ruff>=0.1.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --cov=osf_mcp_server"

[project.scripts]
osf-mcp-server = "osf_mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/osf_mcp_server"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py311"
